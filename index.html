<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Vendor Library — SGE</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0B1F3A;
    --navy-mid: #153251;
    --gold: #C9922B;
    --gold-light: #E8B85A;
    --cream: #FAFAF7;
    --white: #FFFFFF;
    --gray-100: #F5F4F0;
    --gray-200: #E8E6DF;
    --gray-400: #B5B2A8;
    --gray-600: #7A7770;
    --rec-badge: #FDF4E3;
    --rec-text: #8A5E10;
    --portco-badge: #EAF4F0;
    --portco-text: #1A6B4A;
    --font-display: 'DM Serif Display', Georgia, serif;
    --font-body: 'DM Sans', system-ui, sans-serif;
    --search-height: 82px;
  }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font-body); background: var(--cream); color: var(--navy); min-height: 100vh; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }

  .hero { background: var(--navy); padding: 64px 40px 56px; text-align: center; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -80px; left: 50%; transform: translateX(-50%); width: 600px; height: 300px; background: radial-gradient(ellipse, rgba(201,146,43,0.15) 0%, transparent 70%); pointer-events: none; }
  .hero-logo { margin-bottom: 28px; display: flex; justify-content: center; }
  .hero-logo img { height: 48px; width: auto; filter: brightness(0) invert(1); opacity: 0.92; }
  .hero h1 { font-family: var(--font-display); font-size: clamp(36px, 6vw, 60px); font-weight: 400; color: var(--white); line-height: 1.08; margin-bottom: 16px; letter-spacing: -0.01em; }
  .hero h1 em { font-style: italic; color: var(--gold-light); }
  .hero-sub { font-size: 15px; color: rgba(255,255,255,0.55); max-width: 500px; margin: 0 auto 36px; line-height: 1.6; font-weight: 300; }
  .legend { display: flex; align-items: center; justify-content: center; gap: 24px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.7); }
  .badge-rec { background: var(--gold); color: var(--navy); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; }
  .badge-portco { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.9); font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.2); }

  .search-wrap { background: var(--navy-mid); padding: 20px 40px; display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 0; }
  .search-inner { position: relative; width: 100%; max-width: 480px; }
  .search-inner svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.4; pointer-events: none; }
  #search { width: 100%; height: 42px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; color: white; font-family: var(--font-body); font-size: 14px; padding: 0 14px 0 40px; outline: none; transition: border-color 0.2s, background 0.2s; }
  #search::placeholder { color: rgba(255,255,255,0.35); }
  #search:focus { background: rgba(255,255,255,0.12); border-color: var(--gold); }

  .nav-tabs { background: var(--navy-mid); padding: 0 32px; display: flex; overflow-x: auto; border-bottom: 1px solid rgba(255,255,255,0.06); scrollbar-width: none; position: sticky; top: var(--search-height); z-index: 99; margin-top: 0; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .tab-btn { font-family: var(--font-body); font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: rgba(255,255,255,0.5); padding: 14px 16px; cursor: pointer; white-space: nowrap; border: none; background: none; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; text-transform: uppercase; }
  .tab-btn:hover { color: rgba(255,255,255,0.85); }
  .tab-btn.active { color: var(--gold-light); border-bottom-color: var(--gold-light); }

  .main { max-width: 1100px; margin: 0 auto; padding: 48px 32px 80px; flex: 1; width: 100%; }
  .section { margin-bottom: 56px; display: none; }
  .section.visible { display: block; }
  .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--gray-200); }
  .section-title { font-family: var(--font-display); font-size: 26px; font-weight: 400; color: var(--navy); letter-spacing: -0.01em; }
  .section-count { font-size: 12px; font-weight: 500; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.08em; }

  .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .tool-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: 10px; padding: 18px 20px; transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s; }
  .tool-card:hover { border-color: var(--gray-400); box-shadow: 0 4px 16px rgba(11,31,58,0.08); transform: translateY(-1px); }
  .tool-card.is-recommended { border-color: var(--gold); border-left: 3px solid var(--gold); }
  .tool-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .tool-name-wrap { display: flex; align-items: center; flex: 1; min-width: 0; }
  .tool-name { font-size: 15px; font-weight: 600; color: var(--navy); line-height: 1.3; letter-spacing: -0.01em; }
  .tool-name-link { font-size: 15px; font-weight: 600; color: var(--navy); line-height: 1.3; letter-spacing: -0.01em; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; transition: color 0.15s; }
  .tool-name-link:hover { color: var(--gold); }
  .tool-name-link svg { opacity: 0.4; flex-shrink: 0; }
  .tool-badges { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .tool-badge { font-size: 9px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; white-space: nowrap; }
  .tool-badge.rec { background: var(--rec-badge); color: var(--rec-text); border: 1px solid rgba(201,146,43,0.3); }
  .tool-badge.portco { background: var(--portco-badge); color: var(--portco-text); border: 1px solid rgba(26,107,74,0.2); }
  .tool-def { font-size: 13px; color: var(--gray-600); line-height: 1.55; }

  .no-results { text-align: center; padding: 60px 20px; color: var(--gray-600); font-size: 15px; display: none; }
  .no-results.visible { display: block; }
  .footer { background: var(--navy); padding: 28px 40px; text-align: center; font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 0.04em; text-transform: uppercase; }
  mark { background: rgba(201,146,43,0.25); color: inherit; border-radius: 2px; padding: 0 1px; }

  @media (max-width: 600px) {
    :root { --search-height: 74px; }
    .hero { padding: 48px 24px 40px; }
    .search-wrap { padding: 16px 20px; }
    .main { padding: 32px 20px 60px; }
    .nav-tabs { padding: 0 16px; }
    .tool-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

let activeTab = 'all';
let searchQuery = '';

function escHtml(s){ return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : ''; }

function highlight(text, query) {
  if (!query || !text) return escHtml(text || '');
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return escHtml(text).replace(re, '<mark>$1</mark>');
}

function toolMatches(tool, q) {
  if (!q) return true;
  const l = q.toLowerCase();
  return (tool.name||'').toLowerCase().includes(l) || (tool.def||'').toLowerCase().includes(l);
}

function renderCard(tool, q) {
  const badges = [];
  if (tool.rec)    badges.push('<span class="tool-badge rec">SGE Rec</span>');
  if (tool.portco) badges.push('<span class="tool-badge portco">PortCo</span>');
  const url = URLS[tool.name];
  const arrowSvg = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1.5 8.5L8.5 1.5M8.5 1.5H3.5M8.5 1.5V6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const nameHtml = url
    ? `<a href="${url}" class="tool-name-link" target="_blank" rel="noopener">${highlight(tool.name, q)} ${arrowSvg}</a>`
    : `<span class="tool-name">${highlight(tool.name, q)}</span>`;
  return `<div class="tool-card${tool.rec ? ' is-recommended' : ''}">
    <div class="tool-card-top">
      <div class="tool-name-wrap">${nameHtml}</div>
      ${badges.length ? `<div class="tool-badges">${badges.join('')}</div>` : ''}
    </div>
    <div class="tool-def">${highlight(tool.def, q)}</div>
  </div>`;
}

function render() {
  const main = document.getElementById('main');
  const noResults = document.getElementById('no-results');
  const q = searchQuery.trim();
  let total = 0;
  main.innerHTML = '';
  const keys = activeTab === 'all' ? Object.keys(DATA) : [activeTab];
  keys.forEach(key => {
    const tools = DATA[key].filter(t => toolMatches(t, q));
    if (!tools.length) return;
    total += tools.length;
    const sec = document.createElement('div');
    sec.className = 'section visible';
    sec.innerHTML = `<div class="section-header"><h2 class="section-title">${SECTION_LABELS[key]||key}</h2><span class="section-count">${tools.length} tool${tools.length!==1?'s':''}</span></div><div class="tool-grid">${tools.map(t=>renderCard(t,q)).join('')}</div>`;
    main.appendChild(sec);
  });
  noResults.classList.toggle('visible', total === 0);
}

document.getElementById('nav-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
});

let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value;
    if (searchQuery.trim()) {
      activeTab = 'all';
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'all'));
    }
    render();
  }, 160);
});

render();
